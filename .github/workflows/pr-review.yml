name: pr-review
on: pull_request
permissions:
  contents: read
jobs:
  review:
    strategy:
      fail-fast: false
      matrix:
        model: [Qwen3-8B-4bit, Qwen3.5-9B-4bit]
    name: review (${{ matrix.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: guregodevo/memdoor-action@main
        with:
          workflow: pr-review
          local-model: ${{ matrix.model }}
