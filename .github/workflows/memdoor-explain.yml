# Memdoor explains a failed CI run, with a key and on a model inside the job.
name: explain-failure
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  explain:
    if: github.event.workflow_run.conclusion == 'failure'
    strategy:
      fail-fast: false
      matrix:
        mode: [key, local]
    name: explain (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: guregodevo/memdoor-action@v1
        with:
          workflow: explain-failure
          openrouter-api-key: ${{ matrix.mode == 'key' && secrets.OPEN_ROUTER_API_KEY || '' }}
          local-model: ${{ matrix.mode == 'local' && 'Qwen3-8B-4bit' || '' }}
