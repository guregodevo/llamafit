# Memdoor triages a new issue, with a key and on a model inside the job.
name: issue-triage
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: read
# This repository's runs are the maintainer's: memdoor marks its version
# checks me=1, and make metrics leaves them out.
env:
  MEMDOOR_OWNER: "1"

jobs:
  triage:
    strategy:
      fail-fast: false
      matrix:
        mode: [key, local]
    name: triage (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: guregodevo/memdoor-action@v1
        with:
          workflow: issue-triage
          openrouter-api-key: ${{ matrix.mode == 'key' && secrets.OPEN_ROUTER_API_KEY || '' }}
          model: ${{ matrix.mode == 'key' && 'deepseek/deepseek-v4.1-flash' || '' }}
          local-model: ${{ matrix.mode == 'local' && 'Qwen3-8B-4bit' || '' }}
